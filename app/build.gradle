plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.gase.truba'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '2.1'
    }

    // Две версии из одного кода:
    //   full — «Труба», Android 8.0+: фон, картинка-в-картинке
    //   lite — «Трубочка», Android 7.0+: без фона и PiP, ставится рядом с «Трубой»
    flavorDimensions 'os'
    productFlavors {
        full {
            dimension 'os'
            applicationId 'ru.gase.truba'   // если меняете — поправьте src/full/res/xml/shortcuts.xml
            minSdk 26
        }
        lite {
            dimension 'os'
            applicationId 'ru.gase.truba.lite'
            minSdk 24
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
