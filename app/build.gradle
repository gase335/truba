plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.gase.truba'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.gase.truba'   // если меняете — поправьте и res/xml/shortcuts.xml
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
